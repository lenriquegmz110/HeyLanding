<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Constructor de Landings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Panel de Control / Personalización -->
    <aside class="sidebar">
        <h2>Personalizador</h2>

        <h3>Tema</h3>

        <div class="control-group">
            <label for="primaryColor">Color Primario:</label>
            <input type="color" id="primaryColor" value="#3b43b5">
        </div>

        <div class="control-group">
            <label for="borderRadius">Radio de Bordes:</label>
            <select id="borderRadius">
                <option value="4px">Sutil (4px)</option>
                <option value="12px" selected>Moderno (12px)</option>
                <option value="9999px">Pastilla (Redondo)</option>
            </select>
        </div>

        <h3>Secciones</h3>

        <div class="add-row">
            <select id="newSectionType" aria-label="Tipo de sección a agregar"></select>
            <button type="button" id="addSectionBtn" class="btn-small">+ Agregar</button>
        </div>

        <div id="sectionList" class="section-list"></div>

        <p id="saveStatus" class="save-status" role="status"></p>

        <button type="button" id="resetBtn" class="btn-secondary">Restablecer todo</button>
    </aside>

    <!-- Lienzo / Vista Previa de la Landing -->
    <main class="preview-canvas">
        <div id="preview" class="page"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
